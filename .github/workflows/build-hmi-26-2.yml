name: Inspect HMI 26.2 Item Renderer

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ByteMe6/HMI-26.1.2
          path: hmi-source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Configure Minecraft 26.2
        shell: bash
        run: |
          sed -i 's/^minecraft_version=.*/minecraft_version=26.2/' hmi-source/mod/gradle.properties
          sed -i 's/^loader_version=.*/loader_version=0.19.3/' hmi-source/mod/gradle.properties
          sed -i 's/^loom_version=.*/loom_version=1.17.17/' hmi-source/mod/gradle.properties
          sed -i 's/^fabric_api_version=.*/fabric_api_version=0.154.2+26.2/' hmi-source/mod/gradle.properties
          sed -i 's#^distributionUrl=.*#distributionUrl=https\://services.gradle.org/distributions-snapshots/gradle-9.5.1-20260510022507+0000-bin.zip#' hmi-source/mod/gradle/wrapper/gradle-wrapper.properties
      - name: Extract exact ItemInHandRenderer source
        working-directory: hmi-source/mod
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew genSources --console=plain
          python3 - <<'PY'
          import glob, zipfile
          jars=glob.glob('.gradle/loom-cache/**/26.2/*-sources.jar', recursive=True)
          if not jars:
              raise SystemExit('sources jar not found')
          with zipfile.ZipFile(jars[0]) as z:
              name='net/minecraft/client/renderer/ItemInHandRenderer.java'
              data=z.read(name)
          open('../../ItemInHandRenderer-26.2.java','wb').write(data)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: item-in-hand-renderer-26.2-source
          path: ItemInHandRenderer-26.2.java
          if-no-files-found: error

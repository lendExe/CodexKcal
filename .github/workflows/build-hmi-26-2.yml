name: Inspect HMI 26.2 Render APIs Fast

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ByteMe6/HMI-26.1.2
          path: hmi-source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Configure and generate sources
        shell: bash
        run: |
          sed -i 's/^minecraft_version=.*/minecraft_version=26.2/' hmi-source/mod/gradle.properties
          sed -i 's/^loader_version=.*/loader_version=0.19.3/' hmi-source/mod/gradle.properties
          sed -i 's/^loom_version=.*/loom_version=1.17.17/' hmi-source/mod/gradle.properties
          sed -i 's/^fabric_api_version=.*/fabric_api_version=0.154.2+26.2/' hmi-source/mod/gradle.properties
          sed -i 's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions-snapshots/gradle-9.5.1-20260510022507+0000-bin.zip#' hmi-source/mod/gradle/wrapper/gradle-wrapper.properties
          cd hmi-source/mod
          chmod +x gradlew
          ./gradlew genSources --console=plain
      - name: Extract exact relevant sources
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, zipfile, re
          jars=glob.glob('hmi-source/mod/.gradle/loom-cache/**/26.2/*-sources.jar',recursive=True)
          if not jars: raise SystemExit('sources jar not found')
          jar=jars[0]
          print('using',jar)
          with zipfile.ZipFile(jar) as z:
            names=[n for n in z.namelist() if n.endswith('.java')]
            needles=['BufferSource','Outline','ItemFeatureRenderer','ItemSubmit','SubmitNodeStorage','BlendFunction','RenderPipeline','VertexFormat','RenderType','Foil']
            selected=[]
            for n in names:
              base=n.rsplit('/',1)[-1]
              if any(x.lower() in base.lower() for x in needles): selected.append(n); continue
              txt=z.read(n).decode('utf-8','ignore')
              if any(x in txt for x in ['outlineColor()', 'foilType()', 'putBakedQuad', 'getFoil', 'withBindGroup', 'BlendFunction(', 'enum Mode']):
                selected.append(n)
            with open('hmi-render-api-report.txt','w',encoding='utf-8') as f:
              for n in sorted(set(selected)):
                f.write(f'\n===== {n} =====\n')
                f.write(z.read(n).decode('utf-8','ignore'))
          print('selected',len(set(selected)))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hmi-26.2-render-api-report-fast
          path: hmi-render-api-report.txt
          if-no-files-found: error

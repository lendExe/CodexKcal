name: Inspect HMI 26.2 APIs

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ByteMe6/HMI-26.1.2
          path: hmi-source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Configure 26.2 toolchain
        shell: bash
        run: |
          sed -i 's/^minecraft_version=.*/minecraft_version=26.2/' hmi-source/mod/gradle.properties
          sed -i 's/^loader_version=.*/loader_version=0.19.3/' hmi-source/mod/gradle.properties
          sed -i 's/^loom_version=.*/loom_version=1.17.17/' hmi-source/mod/gradle.properties
          sed -i 's/^fabric_api_version=.*/fabric_api_version=0.154.2+26.2/' hmi-source/mod/gradle.properties
          sed -i 's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions-snapshots/gradle-9.5.1-20260510022507+0000-bin.zip#' hmi-source/mod/gradle/wrapper/gradle-wrapper.properties
      - name: Generate and inspect Minecraft sources
        working-directory: hmi-source/mod
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew genSources --console=plain
          python3 - <<'PY'
          import os, zipfile
          roots=['.', os.path.expanduser('~/.gradle')]
          tokens=['MultiBufferSource','OutlineBufferSource','ItemSubmit','getFoilRenderType','mainCamera','toastManager','SourceFactor','DestFactor','withUniform','VertexFormat.Mode']
          out=[]
          seen=set()
          for root in roots:
              for base, _, files in os.walk(root):
                  for fn in files:
                      p=os.path.join(base,fn)
                      if fn.endswith('.java'):
                          try:
                              txt=open(p,encoding='utf-8',errors='ignore').read()
                          except Exception: continue
                          if any(t in txt for t in tokens):
                              key=('file',p)
                              if key not in seen:
                                  seen.add(key); out.append('\n===== '+p+' =====\n'+txt)
                      elif fn.endswith(('.jar','.zip')) and ('source' in fn.lower() or 'minecraft' in p.lower()):
                          try:
                              with zipfile.ZipFile(p) as z:
                                  for n in z.namelist():
                                      if not n.endswith('.java'): continue
                                      txt=z.read(n).decode('utf-8','ignore')
                                      if any(t in txt for t in tokens):
                                          key=(p,n)
                                          if key not in seen:
                                              seen.add(key); out.append('\n===== '+p+' :: '+n+' =====\n'+txt)
                          except Exception: pass
          open('../../hmi-api-report.txt','w',encoding='utf-8').write('\n'.join(out))
          print('matched entries:',len(out))
          PY
      - name: Upload API report
        uses: actions/upload-artifact@v4
        with:
          name: hmi-26.2-api-report
          path: hmi-api-report.txt
          if-no-files-found: error

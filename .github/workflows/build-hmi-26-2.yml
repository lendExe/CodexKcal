name: Diagnose HMI 26.2 In-World Animations

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ByteMe6/HMI-26.1.2
          path: hmi-source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Configure Minecraft 26.2
        shell: bash
        run: |
          sed -i 's/^minecraft_version=.*/minecraft_version=26.2/' hmi-source/mod/gradle.properties
          sed -i 's/^loader_version=.*/loader_version=0.19.3/' hmi-source/mod/gradle.properties
          sed -i 's/^loom_version=.*/loom_version=1.17.17/' hmi-source/mod/gradle.properties
          sed -i 's/^mod_version=.*/mod_version=5.1.1+26.2-worldtest/' hmi-source/mod/gradle.properties
          sed -i 's/^fabric_api_version=.*/fabric_api_version=0.154.2+26.2/' hmi-source/mod/gradle.properties
          sed -i 's#^distributionUrl=.*#distributionUrl=https\://services.gradle.org/distributions-snapshots/gradle-9.5.1-20260510022507+0000-bin.zip#' hmi-source/mod/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/"minecraft": "~26\.1\.2"/"minecraft": "~26.2"/' hmi-source/mod/src/main/resources/fabric.mod.json

      - name: Apply source port and diagnostics
        run: |
          python3 patch_hmi_26_2.py
          python3 patch_hmi_26_2_redirects.py
          python3 patch_hmi_26_2_camera.py
          python3 patch_hmi_26_2_mixins.py
          python3 patch_hmi_26_2_animations.py
          python3 patch_hmi_26_2_lua_debug.py

      - name: Build
        working-directory: hmi-source/mod
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace --console=plain

      - name: Generate vanilla 26.2 test world
        shell: bash
        run: |
          mkdir -p /tmp/hmi-server
          python3 - <<'PY'
          import json
          import urllib.request

          manifest_url = 'https://piston-meta.mojang.com/mc/game/version_manifest_v2.json'
          with urllib.request.urlopen(manifest_url) as response:
              manifest = json.load(response)
          entry = next(v for v in manifest['versions'] if v['id'] == '26.2')
          with urllib.request.urlopen(entry['url']) as response:
              metadata = json.load(response)
          urllib.request.urlretrieve(metadata['downloads']['server']['url'], '/tmp/hmi-server/server.jar')
          PY
          cd /tmp/hmi-server
          printf 'eula=true\n' > eula.txt
          cat > server.properties <<'EOF'
          level-name=AnimationTest
          online-mode=false
          spawn-protection=0
          view-distance=4
          simulation-distance=4
          max-players=1
          enable-command-block=false
          EOF
          set +e
          (sleep 45; echo stop) | timeout 100s java -Xms512M -Xmx1G -jar server.jar nogui 2>&1 | tee "$GITHUB_WORKSPACE/server-world.log"
          test -f AnimationTest/level.dat
          mkdir -p "$GITHUB_WORKSPACE/hmi-source/mod/run/saves"
          cp -a AnimationTest "$GITHUB_WORKSPACE/hmi-source/mod/run/saves/AnimationTest"

      - name: In-world client animation test
        working-directory: hmi-source/mod
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          set +e
          set -o pipefail
          timeout 240s xvfb-run -a ./gradlew runClient --args='--quickPlaySingleplayer AnimationTest' --console=plain 2>&1 | tee ../../client-world.log
          status=${PIPESTATUS[0]}
          if grep -E -q '\[HoldMyItems\] Lua runtime error|InvalidMixinException|InvalidInjectionException|MixinApplyError|Mixin transformation.*failed|ExceptionInInitializerError|Minecraft has crashed' ../../client-world.log; then
            cat ../../client-world.log
            exit 1
          fi
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            cat ../../client-world.log
            exit "$status"
          fi

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hmi-26.2-in-world-diagnostics
          path: |
            client-world.log
            server-world.log
          if-no-files-found: warn

      - name: Upload diagnostic JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: holdmyitems-5.1.1-mc26.2-worldtest
          path: hmi-source/mod/build/libs/*.jar
          if-no-files-found: error
